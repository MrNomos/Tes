name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write   # dibutuhkan untuk membuat Release berisi jar

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: checkout repository
        uses: actions/checkout@v6

      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: setup jdk 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: make gradle wrapper executable
        run: chmod +x ./gradlew

      - name: build
        run: |
          set -o pipefail
          ./gradlew build -Prelease --stacktrace 2>&1 | tee build.log

      - name: error summary
        if: always()
        run: |
          {
            echo "## Build result: ${{ job.status }}"
            echo
            echo "### Errors (first 150 lines)"
            echo '```'
            grep -E -A2 "error:|error: |What went wrong|Execution failed|FAILURE" build.log | head -n 150 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: upload full build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-log
          path: build.log

      - name: collect jar
        run: |
          mkdir -p dist
          for f in build/libs/*.jar; do
            case "$f" in *-sources.jar|*-dev.jar) continue;; esac
            cp "$f" "dist/AUTISM-Client-26.3-run${{ github.run_number }}.jar"
            break
          done
          ls -la dist

      - name: upload jar artifact
        uses: actions/upload-artifact@v7
        with:
          name: AUTISM-Client-26.3
          path: dist/*.jar

      - name: publish release (jar bisa diunduh langsung dari HP)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" dist/*.jar \
            --title "AUTISM Client 26.3 - build ${{ github.run_number }}" \
            --notes "Auto-build untuk Minecraft 26.3 (Fabric). Commit: ${{ github.sha }}" \
            --prerelease
