name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: unzip -q uiutils-hontun.zip
      - name: add orbit dependency
        working-directory: uiutils-hontun
        run: |
          cat >> build.gradle.kts <<'EOT'
          repositories { maven("https://maven.meteordev.org/releases") }
          dependencies { compileOnly("meteordevelopment:orbit:0.2.4") }
          EOT
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current
      - run: gradle build --no-daemon
        working-directory: uiutils-hontun
      - uses: actions/upload-artifact@v4
        with:
          name: uiutils-hontun
          path: uiutils-hontun/build/libs/*.jar
